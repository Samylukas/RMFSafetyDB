name: Deploy PWA to GitHub Pages

on:
  # تشغيل الروبوت أوتوماتيكياً عند أي تعديل على فرع main
  push:
    branches: ["main"]
  # السماح بتشغيل الروبوت يدوياً إذا لزم الأمر
  workflow_dispatch:

# إعطاء الصلاحيات اللازمة للروبوت لرفع الملفات
permissions:
  contents: read
  pages: write
  id-token: write

# منع تشغيل أكثر من عملية تحديث في نفس الوقت لتجنب التداخل
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # رفع كل الملفات الموجودة في المسار الرئيسي
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
