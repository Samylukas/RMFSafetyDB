<!-- Tab 1: Entry with Auto-Fill -->
      <div id="tab-entry" class="tab-content active">
        <form id="surveyForm" onsubmit="submitSurvey(event)">
          <div class="form-grid">
            
            <div class="form-group">
              <label>Registration (REG) <i class="fa-solid fa-plane"></i></label>
              <div class="input-with-btn">
                <!-- استخدام datalist يتيح للمستخدم الكتابة والبحث داخل القائمة -->
                <input type="text" id="reg" list="regList" placeholder="اكتب أو اختر تسجيل الطائرة..." oninput="autoFillAircraftData()" required autocomplete="off">
                <datalist id="regList"></datalist>
                <button type="button" class="add-btn" onclick="openFleetModal()" title="تسجيل طائرة جديدة بالأسطول"><i class="fa-solid fa-plus"></i></button>
              </div>
            </div>

            <div class="form-group">
              <label>Airline NAME (CAR)</label>
              <!-- حقل مغلق (Read-only) يُملأ تلقائياً -->
              <input type="text" id="airline" required readonly style="background-color: #f0f0f0; color: #555; font-weight: bold; cursor: not-allowed;" placeholder="يُملأ تلقائياً...">
            </div>
            
            <div class="form-group">
              <label>Aircraft Type</label>
              <!-- حقل مغلق (Read-only) يُملأ تلقائياً -->
              <input type="text" id="acType" required readonly style="background-color: #f0f0f0; color: #555; font-weight: bold; cursor: not-allowed;" placeholder="يُملأ تلقائياً...">
            </div>
            
            <div class="form-group">
              <label>Flight NO</label>
              <input type="text" id="fltNo" required placeholder="مثال: MS 184">
            </div>
            
            <div class="form-group"><label>Date</label><input type="date" id="date" required></div>
            <div class="form-group"><label>Time</label><input type="time" id="time"></div>
          </div>
          
          <div class="eval-section"><div class="eval-grid" id="criteria-container"></div></div>
          <div class="eval-section"><div class="form-group"><label>Captain Comments (ملاحظات الكابتن)</label><input type="text" id="comments" style="height: 60px;"></div></div>
          <button type="submit" class="submit-btn" id="submitSurveyBtn"><i class="fa-solid fa-cloud-arrow-up"></i> حفظ بيانات الاستبيان</button>
          <p id="surveyMsg" style="text-align: center; margin-top: 15px; font-weight: bold;"></p>
        </form>
      </div>

  <!-- النافذة المنبثقة (Modal) لإضافة طائرة جديدة للأسطول -->
  <div id="addModal" class="modal">
    <div class="modal-content" style="text-align: right;">
      <span class="close-modal" onclick="closeAddModal()">&times;</span>
      <h3 style="color: var(--primary); margin-top: 0; text-align: center;">إضافة طائرة جديدة للأسطول</h3>
      
      <div class="form-group" style="margin-bottom: 15px;">
        <label>تسجيل الطائرة (REG):</label>
        <input type="text" id="newReg" placeholder="مثال: SU-GCM" style="text-transform: uppercase;" required>
      </div>
      
      <div class="form-group" style="margin-bottom: 15px;">
        <label>طراز الطائرة (Type):</label>
        <input type="text" id="newType" placeholder="مثال: B737-800" style="text-transform: uppercase;" required>
      </div>
      
      <div class="form-group" style="margin-bottom: 15px;">
        <label>الشركة المشغلة (Airline):</label>
        <input type="text" id="newAirline" list="airlinesMasterList" placeholder="اختر أو اكتب اسم الشركة" required>
        <datalist id="airlinesMasterList"></datalist>
      </div>

      <p id="modalMsg" style="font-size: 14px; font-weight: bold; text-align: center; margin-top: 10px;"></p>
      <button type="button" class="submit-btn" style="margin-top: 15px; padding: 10px;" onclick="saveNewAircraft()">حفظ في قاعدة البيانات</button>
    </div>
  </div>
