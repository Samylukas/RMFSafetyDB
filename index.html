<!-- Tab 1: Entry -->
      <div id="tab-entry" class="tab-content active">
        <form id="surveyForm" onsubmit="submitSurvey(event)">
          <div class="form-grid">
            <!-- تحويل الحقول إلى قوائم منسدلة مع زر الإضافة -->
            <div class="form-group">
              <label>Airline NAME (CAR)</label>
              <div class="input-with-btn">
                <select id="airline" required><option value="">جاري التحميل...</option></select>
                <button type="button" class="add-btn" onclick="openAddModal('AIRLINES_TBL', 'airline', 'شركة طيران جديدة')" title="إضافة شركة جديدة"><i class="fa-solid fa-plus"></i></button>
              </div>
            </div>
            
            <div class="form-group">
              <label>Flight NO</label>
              <input type="text" id="fltNo" required>
            </div>
            
            <div class="form-group">
              <label>Aircraft Type</label>
              <div class="input-with-btn">
                <select id="acType" required><option value="">جاري التحميل...</option></select>
                <button type="button" class="add-btn" onclick="openAddModal('A_CTYPE_TBL', 'acType', 'طراز طائرة جديد')" title="إضافة طراز جديد"><i class="fa-solid fa-plus"></i></button>
              </div>
            </div>
            
            <div class="form-group">
              <label>Registration (REG)</label>
              <div class="input-with-btn">
                <select id="reg"><option value="">جاري التحميل...</option></select>
                <button type="button" class="add-btn" onclick="openAddModal('REG_TBL', 'reg', 'تسجيل جديد')" title="إضافة تسجيل جديد"><i class="fa-solid fa-plus"></i></button>
              </div>
            </div>
            
            <div class="form-group"><label>Date</label><input type="date" id="date" required></div>
            <div class="form-group"><label>Time</label><input type="time" id="time"></div>
          </div>
          
          <div class="eval-section"><div class="eval-grid" id="criteria-container"></div></div>
          <div class="eval-section"><div class="form-group"><label>Captain Comments (ملاحظات الكابتن)</label><input type="text" id="comments" style="height: 60px;"></div></div>
          <button type="submit" class="submit-btn"><i class="fa-solid fa-cloud-arrow-up"></i> حفظ بيانات الاستبيان</button>
        </form>
      </div>

      <!-- النافذة المنبثقة (Modal) لإضافة بيانات جديدة -->
      <div id="addModal" class="modal">
        <div class="modal-content">
          <span class="close-modal" onclick="closeAddModal()">&times;</span>
          <h3 id="modalTitle" style="color: var(--primary); margin-top: 0;">إضافة عنصر جديد</h3>
          <input type="hidden" id="modalTargetTable">
          <input type="hidden" id="modalTargetSelect">
          <div class="form-group">
            <input type="text" id="modalNewValue" placeholder="اكتب البيانات الجديدة هنا..." required>
          </div>
          <p id="modalMsg" style="font-size: 14px; font-weight: bold;"></p>
          <button type="button" class="submit-btn" style="margin-top: 15px; padding: 10px;" onclick="saveNewItem()">حفظ وإضافة</button>
        </div>
      </div>
