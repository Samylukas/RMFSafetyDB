<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>دليل هاتف مطار مرسى علم الدولي</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <style>
    :root {
      --primary-blue: #003366;
      --light-gray: #E5E7EB;
      --border-color: #D1D5DB;
      --success-green: #28A745;
      --danger-red: #DC3545;
      --warning-yellow: #FFC107;
      --info-cyan: #6f42c1;
      --text-dark: #333;
    }

    body {
      font-family: 'Cairo', sans-serif;
      background-color: #F4F6F8;
      margin: 0;
      padding: 0;
      color: var(--text-dark);
      overflow-x: hidden;
    }

    .dir-container {
      max-width: 1180px;
      margin: 18px auto;
      padding: 0 14px;
    }

    .dir-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
    }

    .dir-page-title {
      color: #6f42c1;
      font-weight: 900;
      font-size: 1.55rem;
      margin: 0;
    }

    .status-container {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #fff;
      padding: 5px 12px;
      border-radius: 20px;
      border: 1px solid #dce4ec;
      font-size: 12.5px;
      font-weight: bold;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: var(--success-green);
    }

    .controls-bar {
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      margin-bottom: 14px;
      align-items: center;
      gap: 10px;
      background: #fff;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #dce4ec;
      box-shadow: 0 2px 8px rgba(0, 51, 102, 0.04);
    }

    .search-box {
      flex-grow: 1;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 9px 34px 9px 34px;
      border: 1.5px solid #6f42c1;
      border-radius: 6px;
      font-family: 'Cairo', sans-serif;
      font-size: 13.5px;
      box-sizing: border-box;
    }

    .search-icon {
      position: absolute;
      right: 11px;
      top: 50%;
      transform: translateY(-50%);
      color: #6f42c1;
      font-size: 13.5px;
    }

    .clear-icon {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      color: #999;
      cursor: pointer;
      display: none;
      font-size: 15px;
    }

    .controls-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .dir-btn {
      padding: 8px 14px;
      border: none;
      border-radius: 6px;
      font-family: 'Cairo', sans-serif;
      font-weight: bold;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      white-space: nowrap;
      transition: opacity 0.2s;
    }

    .dir-btn:hover { opacity: 0.9; }
    .btn-print { background-color: #6f42c1; color: white; }
    .btn-refresh { background-color: var(--info-cyan); color: white; }
    .btn-admin-unlock { background-color: #6f42c1; color: white; display: none; }
    .btn-add { background-color: var(--success-green); color: white; display: none; }
    .btn-exit-admin { background-color: var(--danger-red); color: white; display: none; }

    .table-container {
      background: white;
      border-radius: 8px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.05);
      border: 1px solid #dce4ec;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    #directory-table {
      width: 100%;
      border-collapse: collapse;
      text-align: center;
    }

    .print-spacer { display: none; }

    #directory-table th {
      background-color: #003366;
      color: #ffffff;
      padding: 9px 6px;
      font-size: 12.5px;
      border: 1px solid #1a4a75;
      font-weight: 700;
      white-space: nowrap;
    }

    #directory-table td {
      padding: 6px 6px;
      border: 1px solid var(--border-color);
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-dark);
      line-height: 1.3;
    }

    .dept-row {
      background-color: #E5E7EB !important;
    }

    .dept-row td {
      color: var(--primary-blue) !important;
      font-weight: 900 !important;
      font-size: 16px !important;
      padding: 9px !important;
      text-align: center !important;
    }

    .mobile-cell {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      direction: ltr;
    }

    .mobile-number-text {
      font-weight: bold;
      font-size: 12px;
      white-space: nowrap;
    }

    .quick-actions {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }

    .action-btn-call, .action-btn-wa {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      color: white;
      text-decoration: none;
      font-size: 11px;
    }

    .action-btn-call { background-color: #6f42c1; }
    .action-btn-wa { background-color: #25D366; }

    .action-cell { display: none; width: 80px; }
    .action-btns { display: flex; justify-content: center; gap: 5px; }
    .btn-icon { padding: 4px 8px; border: none; border-radius: 4px; color: white; cursor: pointer; font-size: 11.5px; }
    .btn-edit { background-color: var(--warning-yellow); color: #000; }
    .btn-delete { background-color: var(--danger-red); }

    .dir-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.55);
      align-items: center;
      justify-content: center;
      z-index: 10000;
      padding: 15px;
    }

    .dir-modal-content {
      background: white;
      padding: 22px;
      border-radius: 10px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    }

    .dir-modal-content label {
      display: block;
      font-weight: bold;
      font-size: 12px;
      color: #003366;
      margin-bottom: 3px;
    }

    .dir-modal-content input {
      width: 100%;
      padding: 8px 10px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      box-sizing: border-box;
      font-family: 'Cairo', sans-serif;
      font-size: 13px;
    }

    #emp-mobile {
      direction: ltr !important;
      text-align: right !important;
      font-family: monospace, 'Cairo';
      font-size: 13.5px;
    }

    .loading {
      text-align: center;
      padding: 18px;
      font-weight: bold;
      color: #6f42c1;
      font-size: 14px;
    }

    @media (max-width: 650px) {
      .controls-bar {
        flex-direction: column;
        align-items: stretch;
      }
      .controls-buttons {
        justify-content: space-between;
      }
      .dir-btn {
        flex: 1;
        justify-content: center;
      }
    }

    @media print {
      @page {
        size: A4 portrait;
        margin-top: 0mm;
        margin-bottom: 12mm;
        margin-left: 10mm;
        margin-right: 10mm;
      }
      body {
        background: white !important;
        color: black !important;
        font-size: 10pt;
      }
      .controls-bar, .action-cell, .btn-icon, .dir-modal, .quick-actions, .status-container, .hdr-btn-home, .hdr-btn-logout, .scroll-btn {
        display: none !important;
      }
      .print-spacer {
        display: table-row !important;
        height: 12mm !important;
      }
      .print-spacer td {
        border: none !important;
        background: transparent !important;
        padding: 0 !important;
      }
      .header {
        border-bottom: 2px solid #003366 !important;
        box-shadow: none !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      .dir-container {
        max-width: 100% !important;
        margin: 5px 0 0 0 !important;
        padding: 0 !important;
      }
      .table-container {
        box-shadow: none !important;
        border: none !important;
      }
      #directory-table th {
        background-color: #E5E7EB !important;
        color: #003366 !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
        padding: 5px !important;
        font-size: 10pt !important;
        border: 1px solid #aaa !important;
      }
      #directory-table td {
        padding: 4px !important;
        font-size: 9pt !important;
        border: 1px solid #ccc !important;
      }
      tr { page-break-inside: avoid !important; break-inside: avoid !important; }
      .dept-row {
        background-color: #E5E7EB !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
        page-break-after: avoid !important;
        break-after: avoid !important;
      }
      .dept-row td {
        color: #003366 !important;
        font-weight: 900 !important;
        font-size: 12.5pt !important;
        padding: 6px !important;
      }
    }
  </style>
</head>
<body>

<button id="scrollTop" class="scroll-btn" onclick="window.scrollTo({top:0,behavior:'smooth'})"><i class="fa-solid fa-arrow-up"></i></button>
<button id="scrollBottom" class="scroll-btn" onclick="window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})"><i class="fa-solid fa-arrow-down"></i></button>

<!-- الهيدر الموحد للنظام -->
<div class="header" style="border-bottom-color:#6f42c1;">
  <div class="header-right">
    <img src="LOGO-removebg-preview (1).png" class="main-logo" id="secret-logo" alt="Marsa Alam Airport Logo" title="الضغط 3 مرات لتفعيل وضع الإدارة">
  </div>
  <div class="header-titles">
    <h1>General Department of Safety and Compliance</h1>
    <h2 style="color:#6f42c1;">دليل هاتف مطار مرسى علم الدولي (Airport Phone Directory)</h2>
  </div>
  <div class="header-left">
    <button type="button" class="hdr-btn-home" onclick="window.location.href='index.html'" title="العودة للرئيسية">
      <i class="fa-solid fa-house"></i> الرئيسية
    </button>
    <button type="button" class="hdr-btn-logout" onclick="dirLogout()" title="تسجيل الخروج">
      <i class="fa-solid fa-right-from-bracket"></i> خروج
    </button>
    <img src="wmremove-transformed-removebg-preview.png" class="dept-logo" alt="Safety Emblem">
  </div>
</div>

<div class="dir-container">
  <div class="dir-top-bar">
    <h2 class="dir-page-title"><i class="fa-solid fa-phone-volume" style="color:#6f42c1;"></i> دليل أرقام الطوارئ والإدارات بالمطار</h2>
    </div>

  <div class="controls-bar">
    <div class="search-box">
      <i class="fa-solid fa-search search-icon"></i>
      <input type="text" id="search-input" placeholder="ابحث بالاسم، الوظيفة، الإدارة، أو الرقم الأرضي/الموبايل..." oninput="filterTable()">
      <i class="fa-solid fa-times clear-icon" id="clear-search-btn" onclick="clearSearch()" title="مسح البحث"></i>
    </div>

    <div class="controls-buttons">
      <button type="button" class="dir-btn btn-refresh" onclick="forceRefreshData()"><i class="fa-solid fa-sync-alt"></i> تحديث</button>
      <button type="button" class="dir-btn btn-print" onclick="triggerPrint()"><i class="fa-solid fa-print"></i> طباعة</button>
      <button type="button" class="dir-btn btn-admin-unlock" id="admin-unlock-btn" onclick="enableAdminDirectoryMode()"><i class="fa-solid fa-user-shield"></i> وضع التعديل (Admin)</button>
      <button type="button" class="dir-btn btn-add" id="add-btn" onclick="openModal()"><i class="fa-solid fa-plus"></i> إضافة رقم</button>
      <button type="button" class="dir-btn btn-exit-admin" id="exit-admin-btn" onclick="exitAdminMode()"><i class="fa-solid fa-sign-out-alt"></i> إنهاء التعديل</button>
    </div>
  </div>

  <div class="table-container">
    <table id="directory-table">
      <thead>
        <tr class="print-spacer"><td colspan="6"></td></tr>
        <tr>
          <th style="width: 45px;">م</th>
          <th>الاسم</th>
          <th>الوظيفة</th>
          <th>أرضي (EXT)</th>
          <th>موبايل</th>
          <th class="action-cell">إجراء</th>
        </tr>
      </thead>
      <tbody id="table-body">
        <tr><td colspan="6" class="loading"><i class="fa-solid fa-spinner fa-spin"></i> جاري تحميل بيانات دليل الهاتف...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<div class="dir-modal" id="admin-modal">
  <div class="dir-modal-content">
    <h3 id="modal-title" style="color: #6f42c1; border-bottom: 1.5px solid #003366; padding-bottom: 8px; font-size: 16px; margin-top: 0;">إضافة رقم جديد</h3>
    <input type="hidden" id="emp-id">
    <label>الإدارة / القسم:</label>
    <input type="text" id="emp-dept" list="dirDeptsList" placeholder="اكتب اسم الإدارة...">
    <datalist id="dirDeptsList"></datalist>
    <label>الاسم:</label>
    <input type="text" id="emp-name" placeholder="اسم الموظف أو الجهة...">
    <label>الوظيفة:</label>
    <input type="text" id="emp-role" placeholder="المسمى الوظيفي...">
    <label>الرقم الأرضي (EXT):</label>
    <input type="text" id="emp-ext" placeholder="مثال: 4100">
    <label>رقم الموبايل:</label>
    <input type="text" id="emp-mobile" placeholder="مثال: 0100 000 0000" oninput="formatMobileInput(this)" maxlength="13">
    <div style="display: flex; gap: 8px; margin-top: 8px;">
      <button type="button" class="dir-btn btn-add" style="display: flex; flex: 1; justify-content: center;" onclick="saveRecord()"><i class="fa-solid fa-floppy-disk"></i> حفظ</button>
      <button type="button" class="dir-btn btn-print" style="background: #6c757d; flex: 1; justify-content: center;" onclick="closeModal()">إلغاء</button>
    </div>
  </div>
</div>

<script src="directory.js"></script>
</body>
</html>
